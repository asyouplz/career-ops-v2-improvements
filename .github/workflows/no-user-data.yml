name: Public source boundary

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: read

jobs:
  source-boundary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v9
        with:
          script: |
            // Add new public source paths only after reviewing their contents.
            const allowed = new Set([
              '.github/workflows/no-user-data.yml',
              '.github/workflows/dashboard-check.yml',
              'dashboard/WEB.md',
              'dashboard/backend/mail-sync/GMAIL_SETUP.md',
              'dashboard/backend/mail-sync/classifier.py',
              'dashboard/backend/mail-sync/gmail_api.py',
              'dashboard/backend/mail-sync/gmail_auth.py',
              'dashboard/backend/mail-sync/gmail_sync.py',
              'dashboard/backend/mail-sync/provider.py',
              'dashboard/backend/mail-sync/timing_report.py',
              'dashboard/backend/mail-sync/worker.py',
              'dashboard/backend/mail_store.py',
              'dashboard/backend/server.py',
              'dashboard/run.py',
              'dashboard/web/.gitignore',
              'dashboard/web/.oxfmtrc.json',
              'dashboard/web/.oxlintrc.json',
              'dashboard/web/app/dashboard-types.ts',
              'dashboard/web/app/globals.css',
              'dashboard/web/app/job-movement.tsx',
              'dashboard/web/app/layout.tsx',
              'dashboard/web/app/mail-panel.tsx',
              'dashboard/web/app/page.tsx',
              'dashboard/web/components/ui/button.tsx',
              'dashboard/web/components/ui/collapsible.tsx',
              'dashboard/web/components/ui/dialog.tsx',
              'dashboard/web/components/ui/input.tsx',
              'dashboard/web/components/ui/native-select.tsx',
              'dashboard/web/components/ui/tabs.tsx',
              'dashboard/web/components/ui/textarea.tsx',
              'dashboard/web/lib/utils.ts',
              'dashboard/web/next.config.ts',
              'dashboard/web/package-lock.json',
              'dashboard/web/package.json',
              'dashboard/web/public/about.html',
              'dashboard/web/public/career-info.css',
              'dashboard/web/public/favicon.svg',
              'dashboard/web/public/privacy.html',
              'dashboard/web/public/terms.html',
              'dashboard/web/tsconfig.json',
              'dashboard/web/vite.config.ts',
              'src/dashboard_bootstrap.py',
              'src/dashboard_pipeline.py',
              '.gitignore',
              'README.md',
              'package.json',
              'package-lock.json',
              'requirements.txt',
              'entrypoint.py',
              'scripts/cli.mjs',
              'scripts/setup.py',
              'config/portals.example.yml',
              'config/profile.example.yml',
              'config/runtime.example.json',
              'config/linkedin_queries.example.json',
              'config/profile_evidence.example.json',
              'legacy/career_ops_daily_scan.py',
              'legacy/linkedin_site_search_fetch.py',
              'src/career_ops_daily_v2.py',
              'src/recommendation_ranking.py',
              'src/linkedin_direct_fetch.mjs',
              'src/linkedin_direct_ingest.mjs',
              'src/slack_report.py',
              'src/source_liveness.mjs',
            ]);
            const bundledCode = /^engine\/(?:providers\/|plugins\/|lib\/)?[a-zA-Z0-9_-]+\.(?:mjs|js)$/;
            const bundledMetadata = new Set(['engine/LICENSE', 'engine/templates/states.yml', 'engine/tracker-aliases.json']);
            const excluded = /(^|\/)(?:tests?|fixtures?|__tests__|__mocks__)(\/|[-_.])|\.(?:test|spec)\.|(^|\/)test[-_]/;
            const permitted = file => !excluded.test(file)
              && (allowed.has(file) || bundledMetadata.has(file) || bundledCode.test(file));
            const files = await github.paginate(github.rest.pulls.listFiles, {
              ...context.repo,
              pull_number: context.payload.pull_request.number,
              per_page: 100,
            });
            const blocked = files
              .filter(file => file.status !== 'removed' && !permitted(file.filename))
              .map(file => file.filename);
            if (blocked.length) {
              core.setFailed('Files outside the reviewed public source boundary:\n' + blocked.join('\n'));
            }
